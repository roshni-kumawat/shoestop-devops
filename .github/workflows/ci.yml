name: ShoeStop CI Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: docker/setup-buildx-action@v2
      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./shoestop-backend
          push: false
          tags: shoestop/backend-test:latest
      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v4
        with:
          context: ./shoestop-frontend
          push: false
          tags: shoestop/frontend-test:latest